<html lang="zh-CN">

      --sub:#70788c;
      --pink:#ff6ea9;
      --blue:#7fa8ff;

      --radius:28px;
    }
    *{box-sizing:border-box}
    html,body{margin:0;padding:0}
    body{
      min-height:100vh;
      font-family:"Microsoft YaHei","PingFang SC",sans-serif;
      color:var(--text);

        radial-gradient(circle at 100% 0%, rgba(183,203,255,.55), transparent 24%),
        radial-gradient(circle at 100% 100%, rgba(255,231,193,.4), transparent 18%),
        linear-gradient(135deg,var(--bg1),var(--bg2));
    }

    .wrap{max-width:980px;margin:0 auto;padding:28px 20px 40px;}
    .panel{
      background:var(--card);
      border:1px solid rgba(255,255,255,.7);
      backdrop-filter:blur(10px);
      border-radius:var(--radius);
      box-shadow:var(--shadow);
      overflow:hidden;
    }

    .screen{display:none;animation:fade .35s ease;}
    .screen.active{display:block;}
    @keyframes fade{
      from{opacity:0;transform:translateY(10px)}
      to{opacity:1;transform:none}
    }

    .hero{
      min-height:74vh;
      display:flex;
      align-items:center;
      justify-content:center;
      text-align:center;
      padding:64px 28px;
      position:relative;
      overflow:hidden;
    }
    .hero::before{
      content:"";
      position:absolute;
      width:420px;height:420px;border-radius:50%;
      background:radial-gradient(circle,rgba(255,120,176,.13),transparent 70%);
      top:-120px;left:-80px;pointer-events:none;
    }
    .hero::after{
      content:"";
      position:absolute;
      width:420px;height:420px;border-radius:50%;
      background:radial-gradient(circle,rgba(127,168,255,.16),transparent 70%);
      bottom:-160px;right:-100px;pointer-events:none;
    }
    .hero-inner{max-width:760px;position:relative;z-index:1;}
    .brand{
      display:inline-block;
      margin-bottom:18px;
      padding:8px 14px;
      border-radius:999px;
      background:rgba(255,255,255,.72);
      border:1px solid #e8eefb;
      color:#69758f;
      font-size:13px;
      letter-spacing:.5px;
    }
    .hero-title{
      margin:0 0 16px;
      font-size:clamp(36px,6vw,62px);
      line-height:1.15;
      font-weight:800;
      letter-spacing:.5px;
      color:#ff5c9e;
    }
    .hero-sub{
      margin:0 auto 14px;
      max-width:620px;
      font-size:16px;
      line-height:1.9;
      color:var(--sub);
    }
    .hero-note{
      margin:0 auto 32px;
      max-width:620px;
      font-size:14px;
      line-height:1.8;
      color:#8b92a5;
    }
    .hero-btn{
      border:none;
      border-radius:999px;
      padding:16px 34px;
      font-size:16px;
      font-weight:700;
      color:#fff;
      cursor:pointer;
      background:linear-gradient(90deg,var(--pink),var(--blue));

      justify-content:space-between;
      align-items:center;
      gap:12px;
      color:var(--sub);
      font-size:14px;
      margin-bottom:12px;

      background:#edf2fa;
      overflow:hidden;
      margin-bottom:22px;
    }

      width:0%;
      height:100%;
      background:linear-gradient(90deg,#ff88be,#93b8ff);
      border-radius:999px;
      transition:width .25s ease;
    }
    .q-card{
      background:linear-gradient(135deg,#fffafd,#f8fbff);
      border:1px solid #eef2fa;
      border-radius:24px;
      padding:24px;

      background:#fff;
      border-radius:18px;
      padding:16px 17px;
      cursor:pointer;

      background:#fbfdff;
      transform:translateY(-1px);

      background:linear-gradient(135deg,#fff5fa,#f6faff);
      box-shadow:0 10px 22px rgba(255,130,180,.08);
    }
    .option-label{
      font-size:15px;
      font-weight:700;

      line-height:1.7;

    .option-desc{
      font-size:13px;
      color:#70788b;
      line-height:1.75;

      gap:12px;
      flex-wrap:wrap;
      margin-top:18px;
    }
    .btn-row{display:flex;gap:12px;flex-wrap:wrap;}
    .btn{
      border:none;
      border-radius:15px;
      padding:13px 20px;
      font-size:15px;
      cursor:pointer;
      transition:.2s ease;
      font-family:inherit;

    .btn:hover{transform:translateY(-1px);}
    .btn:disabled{opacity:.5;cursor:not-allowed;transform:none;}
    .btn-main{
      color:#fff;
      font-weight:700;
      background:linear-gradient(90deg,var(--pink),var(--blue));

    .result-image-wrap{

      display:flex;
      align-items:center;
      justify-content:center;

      font-size:16px;
      letter-spacing:1px;

  </style>
</head>

    const restartMidBtn = document.getElementById("restart-mid-btn");
    const copyBtn = document.getElementById("copy-btn");
    const downloadBtn = document.getElementById("download-btn");

    const progressText = document.getElementById("progress-text");
    const progressPercent = document.getElementById("progress-percent");
    const progressBar = document.getElementById("progress");
    const questionTitle = document.getElementById("question-title");
    const questionTip = document.getElementById("question-tip");
    const optionsBox = document.getElementById("options");

    const resultImage = document.getElementById("result-image");
    const resultImageWrap = document.getElementById("result-image-wrap");
    const resultName = document.getElementById("result-name");
    const resultMatch = document.getElementById("result-match");
    const resultDesc = document.getElementById("result-desc");
    const keywordList = document.getElementById("keyword-list");
    const posterCanvas = document.getElementById("poster-canvas");

    function showScreen(screen){
      [startScreen, quizScreen, resultScreen].forEach(s => s.classList.remove("active"));
      screen.classList.add("active");
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function shuffle(arr){
      const a = [...arr];
      for(let i = a.length - 1; i > 0; i--){
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    // 每位角色各抽 1 题 + 混合题 1 题 = 15 题
    function buildQuestionSet(){
      const result = [];

      Object.keys(anchorPools).forEach(charId => {
        const picked = shuffle(anchorPools[charId])[0];
        result.push(picked);
      });

      result.push(shuffle(mixedQuestions)[0]);

      return shuffle(result);
    }

    function startQuiz(){
      activeQuestions = buildQuestionSet();
      currentQuestion = 0;
      answers = new Array(activeQuestions.length).fill(null);
      selectionKeywords = [];
      showScreen(quizScreen);
      renderQuestion();
    }

    function renderQuestion(){
      const q = activeQuestions[currentQuestion];
      questionTitle.textContent = `${currentQuestion + 1}. ${q.title}`;
      questionTip.textContent = q.tip;

      const percent = Math.round(((currentQuestion + 1) / activeQuestions.length) * 100);
      progressText.textContent = `第 ${currentQuestion + 1} 题 / 共 ${activeQuestions.length} 题`;
      progressPercent.textContent = `${percent}%`;
      progressBar.style.width = `${percent}%`;

      optionsBox.innerHTML = "";

      q.options.forEach((opt, idx) => {
        const btn = document.createElement("button");
        btn.className = "option" + (answers[currentQuestion] === idx ? " selected" : "");
        btn.innerHTML = `
          <div class="option-label">${String.fromCharCode(65 + idx)}. ${opt.title}</div>
          <div class="option-desc">${opt.desc}</div>
        `;
        btn.addEventListener("click", () => {
          answers[currentQuestion] = idx;
          renderQuestion();
        });
        optionsBox.appendChild(btn);
      });

      prevBtn.disabled = currentQuestion === 0;
      nextBtn.disabled = answers[currentQuestion] === null;
      nextBtn.textContent = currentQuestion === activeQuestions.length - 1 ? "查看结果" : "下一题";
    }

    function getScoreResult(){
      const scores = {};
      const caps = {};
      const hitCounts = {};

      characters.forEach(c => {
        scores[c.id] = 0;
        caps[c.id] = 0;
        hitCounts[c.id] = 0;
      });

      activeQuestions.forEach((q, qIndex) => {
        // 统计本题里每个角色的理论最高分，用于归一化
        characters.forEach(c => {
          let maxPoint = 0;
          q.options.forEach(opt => {
            const val = (opt.scores && opt.scores[c.id]) || 0;
            if (val > maxPoint) maxPoint = val;
          });
          caps[c.id] += maxPoint;
        });

        // 统计用户实际得分
        const selectedIndex = answers[qIndex];
        if (selectedIndex === null) return;

        const chosen = q.options[selectedIndex];
        Object.keys(chosen.scores || {}).forEach(charId => {
          scores[charId] += chosen.scores[charId];
          if (chosen.scores[charId] >= 2) hitCounts[charId] += 1;
        });
      });

      const ranking = characters.map(char => {
        const actual = scores[char.id] || 0;
        const cap = caps[char.id] || 1;
        const ratio = actual / cap; // 命中率
        const support = Math.min(1, actual / 8); // 证据强度，防止“只中一次就封神”
        const hitBonus = (hitCounts[char.id] || 0) * 2.2;

        let match = ratio * 78 + support * 14 + hitBonus;

        return {
          ...char,
          raw: actual,
          cap,
          ratio,
          hitCount: hitCounts[char.id] || 0,
          match: Math.max(35, Math.min(99, Math.round(match)))
        };
      }).sort((a, b) => {
        if (b.match !== a.match) return b.match - a.match;
        if (b.raw !== a.raw) return b.raw - a.raw;
        return b.hitCount - a.hitCount;
      });

      return { ranking, scores, caps, hitCounts };
    }

    function collectKeywords(){
      const pool = [];
      activeQuestions.forEach((q, idx) => {
        const ans = answers[idx];
        if (ans === null) return;
        const option = q.options[ans];
        (option.tags || []).forEach(tag => pool.push(tag));
      });

      const counter = {};
      pool.forEach(tag => counter[tag] = (counter[tag] || 0) + 1);

      return Object.entries(counter)
        .sort((a, b) => b[1] - a[1])
        .slice(0, 4)
        .map(([tag]) => tag);
    }

    function renderResultImage(src){
      resultImageWrap.classList.remove("no-image");
      resultImage.style.display = "block";
      resultImage.src = src;

      resultImage.onerror = () => {
        resultImage.style.display = "none";
        resultImageWrap.classList.add("no-image");
      };

      resultImage.onload = () => {
        resultImage.style.display = "block";
        resultImageWrap.classList.remove("no-image");
      };
    }

    function showResult(){
      const { ranking } = getScoreResult();
      const winner = ranking[0];
      selectionKeywords = collectKeywords();

      renderResultImage(winner.image);
      resultName.textContent = winner.name;
      resultMatch.textContent = `最契合你的婚约对象 · ${winner.match}%`;
      resultDesc.textContent = winner.desc;

      keywordList.innerHTML = "";
      selectionKeywords.forEach(tag => {
        const div = document.createElement("div");
        div.className = "keyword-item";
        div.textContent = `本次选择关键词：${tag}`;
        keywordList.appendChild(div);
      });

      winner.tags.forEach(tag => {
        const div = document.createElement("div");
        div.className = "keyword-item";
        div.textContent = `她的契合关键词：${tag}`;
        keywordList.appendChild(div);
      });

      showScreen(resultScreen);
    }

    function nextStep(){
      if (answers[currentQuestion] === null) return;
      if (currentQuestion === activeQuestions.length - 1) {
        showResult();
      } else {
        currentQuestion++;
        renderQuestion();
      }
    }

    function prevStep(){
      if (currentQuestion > 0) {
        currentQuestion--;
        renderQuestion();
      }
    }

    function restartAll(){
      if (confirm("确定重新开始测试吗？")) {
        startQuiz();
      }
    }

    function buildResultText(){
      const { ranking } = getScoreResult();
      const winner = ranking[0];
      const keys = collectKeywords().join("、");

      return `初晓CompleX

败北女主太多了！

最契合你的婚约对象：${winner.name}
契合度：${winner.match}%
你的本次关键词：${keys}

解析：
${winner.desc}`;
    }

    async function copyResult(){
      try{
        await navigator.clipboard.writeText(buildResultText());
        alert("结果已复制");
      }catch(e){
        alert("复制失败，可以手动复制页面文字");
      }
    }

    function roundedRect(ctx, x, y, w, h, r){
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.closePath();
    }

    function loadImage(src){
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => resolve(img);
        img.onerror = reject;
        img.src = src;
      });
    }

    async function downloadPoster(){
      const { ranking } = getScoreResult();
      const winner = ranking[0];
      const keys = collectKeywords().join(" / ");
      const ctx = posterCanvas.getContext("2d");

      ctx.clearRect(0, 0, posterCanvas.width, posterCanvas.height);

      const bg = ctx.createLinearGradient(0, 0, 1080, 1460);
      bg.addColorStop(0, "#fff4f9");
      bg.addColorStop(1, "#eef4ff");
      ctx.fillStyle = bg;
      ctx.fillRect(0, 0, 1080, 1460);

      ctx.fillStyle = "rgba(255,110,169,.12)";
      ctx.beginPath();
      ctx.arc(140, 130, 180, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = "rgba(127,168,255,.16)";
      ctx.beginPath();
      ctx.arc(920, 180, 220, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = "#8b92a5";
      ctx.font = "24px Microsoft YaHei";
      ctx.fillText("初晓CompleX", 82, 70);

      ctx.fillStyle = "#ff5a9f";
      ctx.font = "bold 52px Microsoft YaHei";
      ctx.fillText("败北女主太多了！", 80, 130);

      roundedRect(ctx, 60, 190, 960, 1160, 36);
      ctx.fillStyle = "rgba(255,255,255,.94)";
      ctx.fill();

      try {
        const img = await loadImage(winner.image);
        ctx.save();
        roundedRect(ctx, 110, 250, 340, 450, 28);
        ctx.clip();
        ctx.drawImage(img, 110, 250, 340, 450);
        ctx.restore();
      } catch (e) {
        const g = ctx.createLinearGradient(110, 250, 450, 700);
        g.addColorStop(0, "#ffd6e7");
        g.addColorStop(1, "#dfe9ff");
        ctx.fillStyle = g;
        roundedRect(ctx, 110, 250, 340, 450, 28);
        ctx.fill();

        ctx.fillStyle = "#ffffff";
        ctx.font = "32px Microsoft YaHei";
        ctx.fillText("请放入图片", 190, 480);
      }

      ctx.fillStyle = "#ff4f96";
      ctx.font = "bold 64px Microsoft YaHei";
      ctx.fillText(winner.name, 500, 330);

      ctx.fillStyle = "#59647d";
      ctx.font = "28px Microsoft YaHei";
      ctx.fillText("最契合你的婚约对象", 500, 392);
      ctx.fillText(`契合度 ${winner.match}%`, 500, 440);

      ctx.fillStyle = "#6e768b";
      ctx.font = "24px Microsoft YaHei";
      ctx.fillText(`本次关键词：${keys}`, 500, 495);

      ctx.fillStyle = "#465066";
      ctx.font = "bold 34px Microsoft YaHei";
      ctx.fillText("结果解析", 110, 770);

      ctx.font = "26px Microsoft YaHei";
      wrapText(ctx, winner.desc.replace(/\n/g, " "), 110, 830, 840, 42);

      const link = document.createElement("a");
      link.download = `测试结果-${winner.name}.png`;
      link.href = posterCanvas.toDataURL("image/png");
      link.click();
    }

    function wrapText(ctx, text, x, y, maxWidth, lineHeight) {
      const chars = text.split("");
      let line = "";

      for (let i = 0; i < chars.length; i++) {
        const testLine = line + chars[i];
        const metrics = ctx.measureText(testLine);
        if (metrics.width > maxWidth && i > 0) {
          ctx.fillText(line, x, y);
          line = chars[i];
          y += lineHeight;
        } else {
          line = testLine;
        }
      }
      ctx.fillText(line, x, y);
    }

    startBtn.addEventListener("click", startQuiz);
    prevBtn.addEventListener("click", prevStep);
    nextBtn.addEventListener("click", nextStep);
    restartBtn.addEventListener("click", restartAll);
    restartMidBtn.addEventListener("click", restartAll);
    copyBtn.addEventListener("click", copyResult);
    downloadBtn.addEventListener("click", downloadPoster);
  </script>
</body>
</html>
