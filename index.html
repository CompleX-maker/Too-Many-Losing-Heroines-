<html lang="zh-CN">
<head>

  <style>
    :root{
      --bg1:#fff8fb;
      --bg2:#f3f7ff;
      --card:rgba(255,255,255,.9);
      --text:#2f3445;
      --sub:#70788c;
      --pink:#ff6ea9;
      --blue:#7fa8ff;
      --shadow:0 18px 48px rgba(91,111,160,.12);
      --radius:28px;
    }
    *{box-sizing:border-box}
    html,body{margin:0;padding:0}
    body{
      min-height:100vh;
      font-family:"Microsoft YaHei","PingFang SC",sans-serif;
      color:var(--text);
      background:
        radial-gradient(circle at 0% 0%, rgba(255,182,213,.55), transparent 22%),
        radial-gradient(circle at 100% 0%, rgba(183,203,255,.55), transparent 24%),
        radial-gradient(circle at 100% 100%, rgba(255,231,193,.4), transparent 18%),
        linear-gradient(135deg,var(--bg1),var(--bg2));
    }
    .wrap{max-width:980px;margin:0 auto;padding:28px 20px 40px;}
    .panel{
      background:rgba(255,255,255,.9);
      border:1px solid rgba(255,255,255,.7);
      backdrop-filter:blur(10px);
      border-radius:var(--radius);
      box-shadow:var(--shadow);
      overflow:hidden;
    }
    .screen{display:none;animation:fade .35s ease;}
    .screen.active{display:block;}
    @keyframes fade{
      from{opacity:0;transform:translateY(10px)}
      to{opacity:1;transform:none}
    }

    .hero{
      min-height:74vh;
      display:flex;
      align-items:center;
      justify-content:center;
      text-align:center;
      padding:64px 28px;
      position:relative;
      overflow:hidden;
    }
    .hero::before{
      content:"";
      position:absolute;
      width:420px;height:420px;border-radius:50%;
      background:radial-gradient(circle,rgba(255,120,176,.13),transparent 70%);
      top:-120px;left:-80px;pointer-events:none;
    }
    .hero::after{
      content:"";
      position:absolute;
      width:420px;height:420px;border-radius:50%;
      background:radial-gradient(circle,rgba(127,168,255,.16),transparent 70%);
      bottom:-160px;right:-100px;pointer-events:none;
    }
    .hero-inner{max-width:760px;position:relative;z-index:1;}
    .brand{
      display:inline-block;
      margin-bottom:18px;
      padding:8px 14px;
      border-radius:999px;
      background:rgba(255,255,255,.72);
      border:1px solid #e8eefb;
      color:#69758f;
      font-size:13px;
      letter-spacing:.5px;
    }
    .hero-title{
      margin:0 0 16px;
      font-size:clamp(36px,6vw,62px);
      line-height:1.15;
      font-weight:800;
      letter-spacing:.5px;
      color:#ff5c9e;
    }
    .hero-sub{
      margin:0 auto 14px;
      max-width:620px;
      font-size:16px;
      line-height:1.9;
      color:var(--sub);
    }
    .hero-note{
      margin:0 auto 32px;
      max-width:620px;
      font-size:14px;
      line-height:1.8;
      color:#8b92a5;
    }
    .hero-btn{
      border:none;
      border-radius:999px;
      padding:16px 34px;
      font-size:16px;
      font-weight:700;
      color:#fff;
      cursor:pointer;
      background:linear-gradient(90deg,var(--pink),var(--blue));
      box-shadow:0 14px 30px rgba(126,169,255,.22);
      transition:.22s ease;
    }
    .hero-btn:hover{transform:translateY(-2px);filter:brightness(.98);}

    .quiz{padding:26px;}
    .progress-top{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:12px;
      color:var(--sub);
      font-size:14px;
      margin-bottom:12px;
    }
    .progress-bar{
      width:100%;
      height:12px;
      border-radius:999px;
      background:#edf2fa;
      overflow:hidden;
      margin-bottom:22px;
    }
    .progress{
      width:0%;
      height:100%;
      background:linear-gradient(90deg,#ff88be,#93b8ff);
      border-radius:999px;
      transition:width .25s ease;
    }
    .q-card{
      background:linear-gradient(135deg,#fffafd,#f8fbff);
      border:1px solid #eef2fa;
      border-radius:24px;
      padding:24px;
    }
    .q-title{margin:0;font-size:28px;line-height:1.6;}
    .q-tip{margin:10px 0 0;font-size:14px;color:#8b92a5;line-height:1.7;}
    .options{display:grid;gap:14px;margin-top:20px;}
    .option{
      width:100%;
      text-align:left;
      border:2px solid #edf1f8;
      background:#fff;
      border-radius:18px;
      padding:16px 17px;
      cursor:pointer;
      transition:.2s ease;
      font-family:inherit;
    }
    .option:hover{
      border-color:#c6d6ff;
      background:#fbfdff;
      transform:translateY(-1px);
    }
    .option.selected{
      border-color:#ff9cc8;
      background:linear-gradient(135deg,#fff5fa,#f6faff);
      box-shadow:0 10px 22px rgba(255,130,180,.08);
    }
    .option-label{
      font-size:15px;
      font-weight:700;
      margin-bottom:6px;
      color:#333b4d;
    }
    .option-desc{
      font-size:13px;
      color:#70788b;
      line-height:1.75;
    }
    .quiz-actions{
      display:flex;
      justify-content:space-between;
      gap:12px;
      flex-wrap:wrap;
      margin-top:18px;
    }
    .btn-row{display:flex;gap:12px;flex-wrap:wrap;}
    .btn{
      border:none;
      border-radius:15px;
      padding:13px 20px;
      font-size:15px;
      cursor:pointer;
      transition:.2s ease;
      font-family:inherit;
    }
    .btn:hover{transform:translateY(-1px);}
    .btn:disabled{opacity:.5;cursor:not-allowed;transform:none;}
    .btn-main{
      color:#fff;
      font-weight:700;
      background:linear-gradient(90deg,var(--pink),var(--blue));
      box-shadow:0 12px 24px rgba(126,169,255,.18);
    }
    .btn-sub{
      background:#f3f6fc;
      color:#556078;
      border:1px solid #e7edf8;
    }

    .result{padding:26px;}
    .result-grid{
      display:grid;
      grid-template-columns:320px 1fr;
      gap:22px;
      align-items:start;
    }
    .card{
      background:linear-gradient(135deg,#fff9fc,#f8fbff);
      border:1px solid #eef2fa;
      border-radius:24px;
      padding:20px;
    }
    .result-image-wrap{
      width:100%;
      aspect-ratio:3/4;
      border-radius:20px;
      overflow:hidden;
      background:linear-gradient(135deg,#ffd3e5,#dce8ff);
      position:relative;
    }
    .result-image{
      width:100%;height:100%;object-fit:cover;display:block;background:#f5f7fb;
    }
    .result-image-wrap.no-image::after{
      content:"请放入角色图片";
      position:absolute;
      inset:0;
      display:flex;
      align-items:center;
      justify-content:center;
      color:#fff;
      font-size:16px;
      letter-spacing:1px;
      background:linear-gradient(135deg,rgba(255,110,169,.45),rgba(127,168,255,.45));
    }
    .result-name{
      margin:16px 0 8px;
      font-size:34px;
      color:#ff4f96;
      line-height:1.2;
    }
    .result-match{
      display:inline-block;
      padding:8px 12px;
      border-radius:999px;
      background:#fff;
      border:1px solid #edf1f8;
      color:#58627b;
      font-size:14px;
    }
    .section-title{
      margin:0 0 12px;
      font-size:18px;
      color:#4f586d;
    }
    .result-desc{
      white-space:pre-line;
      line-height:1.9;
      color:#444d62;
      font-size:15px;
    }
    .single-col{
      display:grid;
      grid-template-columns:1fr;
      gap:18px;
      margin-top:18px;
    }
    .trait-list{
      display:grid;
      gap:10px;
    }
    .trait-item{
      background:#fff;
      border:1px solid #edf1f8;
      border-radius:16px;
      padding:12px 14px;
    }
    .bar-top{
      display:flex;
      justify-content:space-between;
      gap:12px;
      align-items:center;
      margin-bottom:8px;
      font-size:14px;
    }
    .bar{
      width:100%;
      height:8px;
      border-radius:999px;
      background:#edf2f8;
      overflow:hidden;
    }
    .bar span{
      display:block;
      height:100%;
      border-radius:999px;
      background:linear-gradient(90deg,#ff8ebf,#97b8ff);
    }
    .bottom-actions{
      display:flex;
      gap:12px;
      flex-wrap:wrap;
      margin-top:18px;
    }
    .poster-canvas{display:none;}

    @media (max-width:860px){
      .result-grid,.single-col{grid-template-columns:1fr;}
      .q-title{font-size:23px;}
      .hero{min-height:68vh;}
    }
  </style>
</head>
<body>
  <div class="wrap">

    function shuffle(arr){
      const a = [...arr];
      for(let i = a.length - 1; i > 0; i--){
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function pickRandomQuestions(pool, count){
      return shuffle(pool).slice(0, count);
    }

    function startQuiz(){
      activeQuestions = pickRandomQuestions(questionPool, DRAW_COUNT);
      currentQuestion = 0;
      answers = new Array(activeQuestions.length).fill(null);
      showScreen(quizScreen);

    }

    function renderQuestion(){
      const q = activeQuestions[currentQuestion];
      questionTitle.textContent = q.title;
      questionTip.textContent = q.tip;

      const percent = Math.round(((currentQuestion + 1) / activeQuestions.length) * 100);
      progressText.textContent = `第 ${currentQuestion + 1} 题 / 共 ${activeQuestions.length} 题`;
      progressPercent.textContent = `${percent}%`;
      progressBar.style.width = `${percent}%`;

      optionsBox.innerHTML = "";

      q.options.forEach((opt, idx) => {
        const btn = document.createElement("button");
        btn.className = "option" + (answers[currentQuestion] === idx ? " selected" : "");
        btn.innerHTML = `

          <div class="option-desc">${opt.desc}</div>
        `;
        btn.addEventListener("click", () => {
          answers[currentQuestion] = idx;
          renderQuestion();
        });
        optionsBox.appendChild(btn);
      });

      prevBtn.disabled = currentQuestion === 0;
      nextBtn.disabled = answers[currentQuestion] === null;
      nextBtn.textContent = currentQuestion === activeQuestions.length - 1 ? "查看结果" : "下一题";
    }

    function getUserTraits(){
      const totals = {};
      TRAITS.forEach(t => totals[t.key] = 0);

      activeQuestions.forEach((q, idx) => {
        const ans = answers[idx];
        if (ans === null) return;
        const effect = q.options[ans].effect;
        Object.keys(effect).forEach(key => {
          totals[key] += effect[key];
        });
      });

      return totals;
    }

    function getTraitCaps() {
      const caps = {};
      TRAITS.forEach(t => caps[t.key] = 0);

      activeQuestions.forEach(question => {
        TRAITS.forEach(trait => {
          let maxForThisQuestion = 0;
          question.options.forEach(option => {
            const val = option.effect?.[trait.key] || 0;
            if (val > maxForThisQuestion) maxForThisQuestion = val;
          });
          caps[trait.key] += maxForThisQuestion;
        });
      });

      return caps;
    }

    function normalizeUserTraits(user, caps){
      const normalized = {};
      TRAITS.forEach(t => {
        const cap = caps[t.key] || 1;
        normalized[t.key] = Math.round(((user[t.key] || 0) / cap) * 10);
        normalized[t.key] = Math.max(0, Math.min(10, normalized[t.key]));
      });
      return normalized;
    }

    function meanAbsDiff(a, b){
      let sum = 0;
      TRAITS.forEach(t => {
        sum += Math.abs((a[t.key] || 0) - (b[t.key] || 0));
      });
      return sum / TRAITS.length;
    }

    function cosineSimilarityCentered(a, b){
      let dot = 0;
      let normA = 0;
      let normB = 0;

      TRAITS.forEach(t => {
        const av = (a[t.key] || 0) - 5;
        const bv = (b[t.key] || 0) - 5;
        dot += av * bv;
        normA += av * av;
        normB += bv * bv;
      });

      if (normA === 0 || normB === 0) return 0;
      return dot / (Math.sqrt(normA) * Math.sqrt(normB));
    }

    function getTopTraitKeys(profile, count = 3){
      return TRAITS
        .map(t => [t.key, profile[t.key] || 0])
        .sort((a,b) => b[1] - a[1])
        .slice(0, count)
        .map(([key]) => key);
    }

    function calcRanking() {
      const user = getUserTraits();
      const caps = getTraitCaps();
      const normalizedUser = normalizeUserTraits(user, caps);
      const userTop = getTopTraitKeys(normalizedUser, 4);

      const ranking = characters.map(char => {
        const cosine = cosineSimilarityCentered(normalizedUser, char.profile);
        const cosineScore = ((cosine + 1) / 2) * 100;

        const diff = meanAbsDiff(normalizedUser, char.profile);
        const closenessScore = Math.max(0, 100 - diff * 10);

        let resonance = 0;
        const charTop = getTopTraitKeys(char.profile, 4);

        userTop.forEach(key => {
          if (charTop.includes(key)) resonance += 1.8;
        });

        TRAITS.forEach(t => {
          const u = normalizedUser[t.key] || 0;
          const c = char.profile[t.key] || 0;
          if (u >= 8 && c >= 8) resonance += 0.7;
          if (u <= 2 && c <= 2) resonance += 0.2;
        });

        let match = cosineScore * 0.62 + closenessScore * 0.38 + resonance;

        // 轻微压缩极端分差，让结果更平衡
        match = 55 + (match - 55) * 0.82;

        return {
          ...char,
          match: Math.max(50, Math.min(97, Math.round(match)))
        };
      }).sort((a, b) => b.match - a.match);

      return { ranking, user, normalizedUser, caps };
    }

    function roundedRect(ctx, x, y, w, h, r){
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.closePath();
    }

    function loadImage(src){
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => resolve(img);
        img.onerror = reject;
        img.src = src;
      });
    }

    async function downloadPoster(){
      const { ranking, user } = calcRanking();
      const winner = ranking[0];
      const ctx = posterCanvas.getContext("2d");

      ctx.clearRect(0, 0, posterCanvas.width, posterCanvas.height);

      const bg = ctx.createLinearGradient(0, 0, 1080, 1460);
      bg.addColorStop(0, "#fff4f9");
      bg.addColorStop(1, "#eef4ff");
      ctx.fillStyle = bg;
      ctx.fillRect(0, 0, 1080, 1460);

      ctx.fillStyle = "rgba(255,110,169,.12)";
      ctx.beginPath();
      ctx.arc(140, 130, 180, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = "rgba(127,168,255,.16)";
      ctx.beginPath();
      ctx.arc(920, 180, 220, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = "#8b92a5";
      ctx.font = "24px Microsoft YaHei";
      ctx.fillText("初晓CompleX", 82, 70);

      ctx.fillStyle = "#ff5a9f";
      ctx.font = "bold 52px Microsoft YaHei";
      ctx.fillText("败北女主太多了！", 80, 130);

      roundedRect(ctx, 60, 190, 960, 1160, 36);
      ctx.fillStyle = "rgba(255,255,255,.94)";
      ctx.fill();

      try {
        const img = await loadImage(winner.image);
        ctx.save();
        roundedRect(ctx, 110, 250, 340, 450, 28);
        ctx.clip();
        ctx.drawImage(img, 110, 250, 340, 450);
        ctx.restore();
      } catch (e) {
        const g = ctx.createLinearGradient(110, 250, 450, 700);
        g.addColorStop(0, "#ffd6e7");
        g.addColorStop(1, "#dfe9ff");
        ctx.fillStyle = g;
        roundedRect(ctx, 110, 250, 340, 450, 28);
        ctx.fill();

        ctx.fillStyle = "#ffffff";
        ctx.font = "32px Microsoft YaHei";
        ctx.fillText("请放入图片", 190, 480);
      }

      ctx.fillStyle = "#ff4f96";
      ctx.font = "bold 64px Microsoft YaHei";
      ctx.fillText(winner.name, 500, 330);

      ctx.fillStyle = "#59647d";
      ctx.font = "28px Microsoft YaHei";
      ctx.fillText("最契合你的婚约对象", 500, 392);
      ctx.fillText(`契合度 ${winner.match}%`, 500, 440);

      const topTraits = Object.entries(user)
        .sort((a,b)=>b[1]-a[1])
        .slice(0,4)
        .map(([key]) => TRAITS.find(t => t.key === key)?.label || key)
        .join(" / ");

      ctx.fillStyle = "#6e768b";
      ctx.font = "24px Microsoft YaHei";
      ctx.fillText(`你的倾向：${topTraits}`, 500, 495);

      ctx.fillStyle = "#465066";
      ctx.font = "bold 34px Microsoft YaHei";
      ctx.fillText("结果解析", 110, 770);

      ctx.font = "26px Microsoft YaHei";
      wrapText(ctx, winner.desc.replace(/\n/g, " "), 110, 830, 840, 42);

      const link = document.createElement("a");
      link.download = `测试结果-${winner.name}.png`;
      link.href = posterCanvas.toDataURL("image/png");
      link.click();
    }

    function wrapText(ctx, text, x, y, maxWidth, lineHeight) {
      const chars = text.split("");
      let line = "";

      for (let i = 0; i < chars.length; i++) {
        const testLine = line + chars[i];
        const metrics = ctx.measureText(testLine);
        if (metrics.width > maxWidth && i > 0) {
          ctx.fillText(line, x, y);
          line = chars[i];
          y += lineHeight;
        } else {
          line = testLine;
        }
      }
      ctx.fillText(line, x, y);
    }
